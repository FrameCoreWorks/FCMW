<!doctype html>
<!-- FCWM recipe "film-blocks": a title card, three transitions, a lower third, word-timed captions and an
     end card, all from lib/blocks.js. 16:9, 12 s, no GSAP, every frame from t alone (hf-seek).
     Colours, typeface and words are neutral placeholders: the film's own (or a brand kit) replace them. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      :root {
        --ground: #111111;
        --ink: #f2f2f2;
        --accent: #8a8a8a;
        --font-display: system-ui, sans-serif;
        --font-body: system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; color: var(--ink); font-family: var(--font-body); }
      .scene { position: absolute; inset: 0; overflow: hidden; background: var(--ground); }
      /* Each scene a step lighter, so the transitions read on a neutral palette */
      #s2 { background: color-mix(in srgb, var(--ground), var(--ink) 7%); }
      #s3 { background: color-mix(in srgb, var(--ground), var(--ink) 13%); }
      .card { position: absolute; left: 160px; top: 360px; }
      .title { font-family: var(--font-display); font-size: 150px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
      .rule { height: 8px; width: 900px; margin: 40px 0 32px; background: var(--accent); transform-origin: left center; }
      .subtitle { font-size: 48px; color: var(--accent); }
      .frame { position: absolute; left: 160px; right: 160px; top: 120px; bottom: 360px; border: 4px solid var(--accent); border-radius: 24px; }
      .lt { position: absolute; left: 160px; bottom: 150px; }
      .lt .bar { height: 96px; width: 760px; background: var(--ink); transform-origin: left center; }
      .lt .name { position: absolute; left: 32px; top: 14px; font-size: 52px; font-weight: 700; color: var(--ground); white-space: nowrap; }
      .lt .role { position: absolute; left: 0; top: 116px; font-size: 36px; color: var(--accent); white-space: nowrap; }
      .cap { position: absolute; left: 0; right: 0; bottom: 170px; text-align: center; font-size: 64px; font-weight: 700; }
      .cap span { display: inline-block; margin: 0 0.16em; color: var(--accent); }
      .cap span.on { color: var(--ink); }
      .end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .mark { width: 220px; height: 220px; border-radius: 50%; border: 18px solid var(--ink); }
      .line { margin-top: 48px; font-size: 44px; color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12"
         data-width="1920" data-height="1080" data-fps="30" data-no-timeline>
      <section class="scene" id="s1">
        <div class="card"><h1 class="title" id="t1">Title card</h1><div class="rule" id="r1"></div><p class="subtitle" id="st1">A subtitle in one line</p></div>
      </section>
      <section class="scene" id="s2">
        <div class="frame"></div>
        <div class="lt"><div class="bar" id="ltb"></div><div class="name" id="ltn">Name Surname</div><div class="role" id="ltr">Role or place</div></div>
      </section>
      <section class="scene" id="s3">
        <div class="frame"></div>
        <p class="cap" id="cap"></p>
      </section>
      <section class="scene" id="s4">
        <div class="end"><div class="mark" id="mark"></div><p class="line" id="line">your-site.example</p></div>
      </section>
    </div>
    <script type="module">
      import { transition, titleCard, lowerThird, captionLines, caption, endCard, css } from './lib/fcwm/blocks.js';

      const $ = (id) => document.getElementById(id);
      const scenes = ['s1', 's2', 's3', 's4'].map($);
      // Cut points: the transition that brings in scene i + 1. Transitions never overlap.
      const DUR = 0.7;
      const CUTS = [[3.5, 'wipe'], [7.0, 'push'], [9.5, 'iris']];
      // Word timings as a speech-to-text tool gives them (seconds); captionLines groups them into lines.
      const WORDS = [['Captions', 7.4], ['follow', 7.75], ['the', 8.0], ['voice', 8.15], ['word', 8.6], ['by', 8.85], ['word', 9.0]]
        .map(([w, start], i, all) => ({ w, start, end: all[i + 1] ? all[i + 1][1] : start + 0.45 }));
      const LINES = captionLines(WORDS, { maxChars: 28 });
      const cap = $('cap');

      function sceneState(t, i) {
        // Until the transition into scene i is over, scene i follows it; after that, the one out of it.
        if (i > 0 && t < CUTS[i - 1][0] + DUR / 2) return transition(t, CUTS[i - 1][0], { kind: CUTS[i - 1][1], dur: DUR }).in;
        if (i < CUTS.length) return transition(t, CUTS[i][0], { kind: CUTS[i][1], dur: DUR }).out;
        return transition(t, CUTS[i - 1][0], { kind: CUTS[i - 1][1], dur: DUR }).in;
      }

      function renderAt(t) {
        scenes.forEach((el, i) => { el.style.cssText = css(sceneState(t, i)) + `;z-index:${i}`; });

        // The title is already rising at frame 0, so the first frame (the thumbnail) is not empty.
        const tc = titleCard(t + 0.35, { start: 0, hold: 4.2, leave: 0.01 });
        $('t1').style.cssText = css(tc.title);
        $('r1').style.cssText = css(tc.rule) + `;transform:scaleX(${tc.rule.width.toFixed(4)})`;
        $('st1').style.cssText = css(tc.subtitle);

        const lt = lowerThird(t, { start: 4.2, hold: 2.0 });
        $('ltb').style.cssText = css(lt.bar) + `;transform:scaleX(${lt.bar.width.toFixed(4)})`;
        $('ltn').style.cssText = css(lt.name);
        $('ltr').style.cssText = css(lt.role);

        const c = caption(t, LINES);
        cap.style.opacity = c ? c.opacity.toFixed(4) : '0';
        if (c) {
          if (cap.dataset.line !== String(c.line)) {  // rebuild the spans only when the line changes
            cap.dataset.line = String(c.line);
            cap.replaceChildren(...c.words.map((w) => Object.assign(document.createElement('span'), { textContent: w.w })));
          }
          c.words.forEach((w, i) => {
            const span = cap.children[i];
            span.className = w.past || w.active ? 'on' : '';
            span.style.transform = w.active ? `translateY(${((1 - Math.min(1, w.pop)) * 18).toFixed(2)}px)` : 'none';  // only the spoken word pops
          });
        }

        const ec = endCard(t, { start: 9.35 })  // the logo settles while the iris opens: no empty frame;
        $('mark').style.cssText = css(ec.logo);
        $('line').style.cssText = css(ec.line);
      }

      window.addEventListener('hf-seek', (e) => renderAt(e.detail.time));
      renderAt(0);
    </script>
  </body>
</html>
