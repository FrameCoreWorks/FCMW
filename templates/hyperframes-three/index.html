<!doctype html>
<!-- FCWM starter for 3-D in HyperFrames with three.js (MIT). The film is a pure function of time:
     renderAt(t) poses the scene from t alone and renders one WebGL frame, driven by HyperFrames'
     hf-seek event. No clock, no requestAnimationFrame, no state carried between frames.
     The ring, the colours and the typeface are neutral placeholders: replace them with the film's own.
     Blocks for three.js scenes: lib/fcwm/three/ (point clouds, voxels); camera moves: lib/fcwm/camera.js. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <style>
      @font-face { font-family: Display; src: url(fonts/display.woff2) format('woff2'); font-weight: 100 900; }
      @font-face { font-family: Display; src: url(fonts/display-ext.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0100-024F, U+1E00-1EFF; }
      :root { --ground: {{GROUND}}; --ink: #f2f2f2; --font-display: Display, sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); color: var(--ink); }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; }
      #title { position: absolute; left: 8%; right: 8%; top: 70%; font-size: {{SIZE}}px; font-weight: 700;
               letter-spacing: -0.03em; line-height: 1; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}"
         data-width="{{W}}" data-height="{{H}}" data-fps="{{FPS}}" data-no-timeline>
      <canvas id="gl" width="{{W}}" height="{{H}}"></canvas>
      <h1 id="title" aria-label="{{TEXT_ATTR}}"></h1>
    </div>
    <script type="module">
      import * as THREE from './lib/three/three.module.js';
      import { ease, prog, spring } from './lib/fcwm/core.js';

      const W = {{W}}, H = {{H}};
      const TEXT = {{TEXT_JS}};  // the film's own words (from --title); change it here and in the aria-label above
      const title = document.getElementById('title');
      title.textContent = TEXT;
      const fit = Math.min(1, title.clientWidth / title.scrollWidth);  // a long title shrinks once to fit
      if (fit < 1) title.style.fontSize = `${(parseFloat(getComputedStyle(title).fontSize) * fit).toFixed(2)}px`;

      // preserveDrawingBuffer keeps the frame for HyperFrames' capture; pixel ratio 1 so every machine
      // renders the same pixels; alpha follows the ground (transparent films).
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true,
        alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 100);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.32, 96, 256),
        new THREE.MeshStandardMaterial({ color: 0x9a9a9a, metalness: 0.7, roughness: 0.28 }));
      scene.add(ring, new THREE.HemisphereLight(0xffffff, 0x202020, 0.6));
      const key = new THREE.DirectionalLight(0xffffff, 3.2); key.position.set(3, 4, 5); scene.add(key);
      const rim = new THREE.DirectionalLight(0xffffff, 2.0); rim.position.set(-4, -1, -3); scene.add(rim);

      function renderAt(t) {
        // the ring is on screen from frame 0 (the hook) and keeps turning; the camera eases in and orbits
        const settle = spring(t, { stiffness: 90, damping: 14 });
        ring.rotation.set(0.6 + t * 0.35, t * 0.9, 0.2);
        ring.scale.setScalar(0.85 + 0.15 * settle);
        const a = 0.25 * Math.sin(t * 0.6);
        const dist = 12 - 2 * ease.outCubic(prog(t, 0, 2.5));
        camera.position.set(Math.sin(a) * dist, 0.6, Math.cos(a) * dist);
        camera.lookAt(0, -0.8, 0);  // looking below the ring puts it in the upper half, above the title
        renderer.render(scene, camera);
        const k = ease.outCubic(prog(t, 0, 0.8));
        title.style.transform = `translateY(${((1 - k) * 0.6 * parseFloat(title.style.fontSize || {{SIZE}})).toFixed(2)}px)`;
        title.style.opacity = (0.35 + 0.65 * k).toFixed(3);
      }

      window.addEventListener('hf-seek', (e) => renderAt(e.detail.time));
      renderAt(0);
    </script>
  </body>
</html>
