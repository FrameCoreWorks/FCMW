name: smoke

# Creates, renders and checks one short film per engine with the real tools.

# Renders run only for this repository's own branches (push, workflow_dispatch, pull requests from a
# branch here). Pull requests from forks never render: the job is skipped. Fork PRs get only the
# render-free `validate` workflow, and only after a maintainer approves the run.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/fcwm.mjs doctor
      - run: node scripts/smoke.mjs
