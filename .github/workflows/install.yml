name: install

# The one-line installers on macOS, Windows and Linux: a clean FCWM home, a film folder whose path has
# a space, '&' and an apostrophe, install only what is missing, render contact sheets, then run again
# and expect every tool to be skipped. Runs only when the installer or the CLI changes.

# Renders run only for this repository's own branches (push, workflow_dispatch, pull requests from a
# branch here). Pull requests from forks never render: the job is skipped. Fork PRs get only the
# render-free `validate` workflow, and only after a maintainer approves the run.
on:
  pull_request:
    paths: [scripts/install.sh, scripts/install.ps1, scripts/fcwm.mjs, scripts/lib/**, .github/workflows/install.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: First run (installs what is missing, renders)
        env:
          FCWM_SRC: ${{ github.workspace }}
          FCWM_HOME: ${{ runner.temp }}/fcwm-home
        run: |
          FILMS="$RUNNER_TEMP/Codex&Claude/Klient's films"
          mkdir -p "$FILMS"
          (cd "$FILMS" && node "$GITHUB_WORKSPACE/scripts/fcwm.mjs" new install-test --duration 2)
          bash scripts/install.sh "$FILMS/install-test" --check
          ls "$FILMS/install-test/render"
          test -f "$FCWM_HOME/state.json"
      - name: Second run (skips every install)
        env:
          FCWM_SRC: ${{ github.workspace }}
          FCWM_HOME: ${{ runner.temp }}/fcwm-home
        run: |
          FILMS="$RUNNER_TEMP/Codex&Claude/Klient's films"
          bash scripts/install.sh "$FILMS/install-test" --check | tee second.log
          grep -q "already installed, skipping: FCWM" second.log
          grep -q "nothing to install" second.log

  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: First run (installs what is missing, renders)
        shell: pwsh
        env:
          FCWM_SRC: ${{ github.workspace }}
          FCWM_HOME: ${{ runner.temp }}\fcwm-home
        run: |
          $Films = Join-Path $env:RUNNER_TEMP "Codex&Claude\Klient's films"
          New-Item -ItemType Directory -Force -Path $Films | Out-Null
          Push-Location $Films; node "$env:GITHUB_WORKSPACE\scripts\fcwm.mjs" new install-test --duration 2; Pop-Location
          # same entry as the published one-liner, from this checkout instead of GitHub
          & ([scriptblock]::Create((Get-Content scripts\install.ps1 -Raw))) (Join-Path $Films 'install-test') --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem (Join-Path $Films 'install-test\render')
          if (-not (Test-Path "$env:FCWM_HOME\state.json")) { throw 'state.json missing' }
      - name: Second run (skips every install)
        shell: pwsh
        env:
          FCWM_SRC: ${{ github.workspace }}
          FCWM_HOME: ${{ runner.temp }}\fcwm-home
        run: |
          $Films = Join-Path $env:RUNNER_TEMP "Codex&Claude\Klient's films"
          $out = & ([scriptblock]::Create((Get-Content scripts\install.ps1 -Raw))) (Join-Path $Films 'install-test') --check *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'nothing to install') { throw 'expected every tool to be skipped' }

  # A computer with nothing on it: no Node.js and no package manager (a Mac without Homebrew, Windows
  # without winget). Node, FFmpeg and the GitHub CLI must arrive per user, without admin rights.
  mac-fresh:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install and render with system tools only
        env:
          FCWM_SRC: ${{ github.workspace }}
          FCWM_HOME: ${{ runner.temp }}/fcwm-fresh
        run: |
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          for t in node brew ffmpeg; do if command -v $t; then echo "expected no $t on PATH"; exit 1; fi; done
          FILMS="$RUNNER_TEMP/Moje filmy"
          mkdir -p "$FILMS"
          bash scripts/install.sh "$FILMS/missing" || true   # installs Node + FCWM, then fails on the missing folder
          (cd "$FILMS" && "$FCWM_HOME/bin/node" "$FCWM_HOME/app/scripts/fcwm.mjs" new fresh-test --duration 2)
          bash scripts/install.sh "$FILMS/fresh-test" --check
          ls "$FILMS/fresh-test/render"
          "$FCWM_HOME/bin/ffmpeg" -version | head -1
          "$FCWM_HOME/bin/node" --input-type=module -e "const m = await import('$FCWM_HOME/app/scripts/lib/portable.mjs'); console.log(await m.installPortable('gh', { home: process.env.FCWM_HOME }))"
          "$FCWM_HOME/bin/gh" --version

  windows-fresh:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install and render with system tools only
        shell: pwsh
        env:
          FCWM_SRC: ${{ github.workspace }}
          FCWM_HOME: ${{ runner.temp }}\fcwm-fresh
        run: |
          $env:Path = "$env:SystemRoot\system32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0;$env:SystemRoot\System32\Wbem;$PSHOME"
          if (Get-Command node, winget, ffmpeg, choco, scoop -ErrorAction SilentlyContinue) { throw 'expected a bare PATH' }
          $Films = Join-Path $env:RUNNER_TEMP 'Moje filmy'
          New-Item -ItemType Directory -Force -Path $Films | Out-Null
          & ([scriptblock]::Create((Get-Content scripts\install.ps1 -Raw))) (Join-Path $Films 'missing')
          Push-Location $Films; node "$env:FCWM_HOME\app\scripts\fcwm.mjs" new fresh-test --duration 2; Pop-Location
          & ([scriptblock]::Create((Get-Content scripts\install.ps1 -Raw))) (Join-Path $Films 'fresh-test') --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem (Join-Path $Films 'fresh-test\render')
          & "$env:FCWM_HOME\bin\ffmpeg.exe" -version | Select-Object -First 1
